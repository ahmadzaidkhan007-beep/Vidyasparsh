<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E📚%3C/text%3E%3C/svg%3E"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Mukta:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Admin – Vidyasparsh</title><meta name="robots" content="noindex,nofollow"></head>
<body><main class="wrap" id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="app.js"></script>
<script>
shell();
let books = [], editing = null;
const slugify = t => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const say = t => toast(t);
(async function init() {
  if (!db) { $("app").innerHTML = '<div class="box"><h2>Setup needed</h2><p>Add your Supabase URL and key in config.js, then reload.</p></div>'; return; }
  const { data } = await db.auth.getSession();
  data.session ? panel() : login();
})();
function login() {
  $("app").innerHTML = `<form class="box" id="lf"><h2>Admin login</h2><input id="em" type="email" placeholder="Email" autocomplete="username" required><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn">Log in</button></form>`;
  $("lf").onsubmit = async e => { e.preventDefault(); const { error } = await db.auth.signInWithPassword({ email: $("em").value, password: $("pw").value }); error ? say(error.message) : panel(); };
}
async function panel() {
  books = await loadBooks();
  $("app").innerHTML = `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0"><h1 style="margin-right:auto">Manage books</h1><button class="btn alt" id="sm">Download sitemap.xml</button><button class="btn alt" id="lo">Log out</button></div>
  <form class="box" id="f" style="max-width:none"><h2 id="ft">Add a book</h2>
  <input id="t" placeholder="Title" required><input id="a" placeholder="Author">
  <input id="c" list="cl" placeholder="Class (e.g. Class 10)" required><datalist id="cl">${[...Array(12)].map((_, i) => `<option>Class ${i + 1}</option>`).join("")}<option>College</option></datalist>
  <input id="s" placeholder="Subject (e.g. Science)" required><input id="p" type="number" min="0" placeholder="Price in rupees" required>
  <textarea id="d" rows="4" placeholder="Description"></textarea>
  <label>Cover colour (used when there is no image) <input id="col" type="color" value="#232f6b"></label>
  <label>Cover image <input id="file" type="file" accept="image/*"></label>
  <label><input id="st" type="checkbox" checked style="width:auto"> In stock</label>
  <div style="display:flex;gap:10px"><button class="btn" id="save">Save book</button><button type="button" class="btn alt" id="cancel" hidden>Cancel edit</button></div></form>
  <div class="tbl"><table><tr><th>Title</th><th>Class</th><th>Subject</th><th>Price</th><th></th></tr>${books.map(b => `<tr><td>${esc(b.title)}</td><td>${esc(b.cls)}</td><td>${esc(b.subject)}</td><td>${money(b.price)}</td><td><button class="btn alt" data-e="${b.id}">Edit</button> <button class="btn alt" data-x="${b.id}">Delete</button></td></tr>`).join("")}</table></div>`;
  $("lo").onclick = async () => { await db.auth.signOut(); login(); };
  $("sm").onclick = sitemap;
  $("cancel").onclick = () => { editing = null; panel(); };
  $("f").onsubmit = save;
  $("app").onclick = async e => {
    const ed = e.target.closest("[data-e]"), dl = e.target.closest("[data-x]");
    if (ed) { editing = books.find(b => b.id === ed.dataset.e); $("ft").textContent = "Edit book"; $("cancel").hidden = false;
      $("t").value = editing.title; $("a").value = editing.author; $("c").value = editing.cls; $("s").value = editing.subject; $("p").value = editing.price; $("d").value = editing.description; $("col").value = editing.color || "#232f6b"; $("st").checked = editing.in_stock !== false; scrollTo(0, 0); }
    if (dl && confirm("Delete this book permanently?")) { const { error } = await db.from("books").delete().eq("id", dl.dataset.x); error ? say(error.message) : (say("Deleted"), panel()); }
  };
}
async function save(e) {
  e.preventDefault(); $("save").disabled = true;
  let url = editing ? editing.cover_url : null; const f = $("file").files[0];
  if (f) { const path = Date.now() + "-" + f.name.replace(/[^\w.]/g, "_"); const up = await db.storage.from("covers").upload(path, f);
    if (up.error) { say(up.error.message); $("save").disabled = false; return; } url = db.storage.from("covers").getPublicUrl(path).data.publicUrl; }
  const row = { title:$("t").value.trim(), author:$("a").value.trim(), cls:$("c").value.trim(), subject:$("s").value.trim(), price:+$("p").value, description:$("d").value.trim(), color:$("col").value, in_stock:$("st").checked, cover_url:url };
  let r;
  if (editing) r = await db.from("books").update(row).eq("id", editing.id);
  else { row.slug = slugify(row.title) + "-" + Math.random().toString(36).slice(2, 6); r = await db.from("books").insert(row); }
  if (r.error) { say(r.error.message); $("save").disabled = false; return; }
  say("Saved"); editing = null; panel();
}
function sitemap() {
  const u = [SITE.domain + "/", ...books.map(b => `${SITE.domain}/book.html?s=${encodeURIComponent(b.slug)}`)];
  const xml = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' + u.map(x => `<url><loc>${x.replace(/&/g, "&amp;")}</loc></url>`).join("\n") + "\n</urlset>";
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([xml], { type: "application/xml" })); a.download = "sitemap.xml"; a.click();
}
</script></body></html>
